# Blank: fill in your own day. One value per local hour, 0 (empty) to 1 (full).
# 空白：自己填。每小时一个数，0（空）到 1（满）。他睡觉或休息的钟点填高一点，
# 通常很累的钟点填低一点。把填好的 schedule = [...] 这一项放进你 kitchenette.toml 的 [stamina] 段里
# （不要再写第二个 [stamina] 标题）。
# Higher during the hours the role sleeps or rests, lower when it is usually
# worn out. Every slot starts at 0.70, the level a new role begins with.

[stamina]
