<!DOCTYPE html>
<!--
  The kitchen page inside another page, in an <iframe>. 把厨房页用 <iframe> 嵌进别的页面。

  Try it / 试一下:
    1. In the kitchen server's settings, allow this page's origin to frame the kitchen page
       在厨房服务的设置里，允许这个页面所在的地址嵌它:
           [server]
           embed_origins = ["http://127.0.0.1:8000"]
    2. Serve this file from that origin, for example / 从那个地址提供这个文件，比如:
           python -m http.server 8000 --bind 127.0.0.1 --directory examples
    3. Open / 打开  http://127.0.0.1:8000/page_embed.html?kitchen=http://127.0.0.1:8765

  The protocol is in docs/PAGE.md ("Embedding"). What this file shows:
  - the frame's address carries ?host=<this page's origin>; without it the kitchen page talks to nobody;
  - the token is handed over in an `init` message after the page says `ready`, never in an address;
  - messages are posted to the kitchen's origin and only accepted from it (never "*").
  协议见 docs/PAGE.md「嵌入」一节。这个文件演示了三件事：框里的地址要带 ?host=<本页的来源>；
  口令在页面说 ready 之后用 init 消息递过去，不写进地址；消息只发给、也只收自厨房的来源（不用 "*"）。
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A page that embeds the kitchen</title>
    <style>
      body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #f2efe9; color: #333; }
      header { padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      input { font: inherit; padding: 4px 8px; }
      button { font: inherit; padding: 4px 12px; }
      iframe { display: block; width: 390px; max-width: 100%; height: 780px; border: 1px solid #c9c2b6; margin: 0 16px 16px; background: #fbf6ef; }
      #log { margin: 0 16px 24px; font: 12px/1.6 ui-monospace, monospace; color: #666; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <header>
      <label>Token (if the server has one) <input id="token" type="password" autocomplete="off" /></label>
      <label>Role <input id="who" placeholder="default" size="10" /></label>
      <button id="send">Send to the kitchen</button>
    </header>
    <iframe id="kitchen" title="Kitchen"></iframe>
    <pre id="log"></pre>
    <script>
      const kitchen = new URL(new URLSearchParams(location.search).get("kitchen") || "http://127.0.0.1:8765").origin;
      const frame = document.getElementById("kitchen");
      const log = (line) => (document.getElementById("log").textContent += line + "\n");
      let ready = false;
      let seq = 0;

      // post to the kitchen's origin only
      const post = (type, payload) => {
        const id = "h" + ++seq;
        frame.contentWindow.postMessage({ v: 1, id, type, payload }, kitchen);
        return id;
      };
      const init = () => {
        const who = document.getElementById("who").value.trim();
        // apiBase is left out: the page talks to the server it was loaded from
        post("init", { credential: document.getElementById("token").value, ...(who ? { who } : {}) });
      };

      window.addEventListener("message", (e) => {
        if (e.origin !== kitchen || e.source !== frame.contentWindow) return; // accept from the kitchen only
        const m = e.data || {};
        if (m.type === "ready") {
          ready = true;
          log("kitchen: ready");
          init(); // every `ready` is answered with `init` (the page says it again after a reload)
        } else if (m.type === "close") {
          log("kitchen: close (the person pressed back)");
        } else if ("ok" in m) {
          log(m.ok ? `kitchen: ok (${m.id})` : `kitchen: refused (${m.id}): ${m.error}`);
        }
      });
      document.getElementById("send").addEventListener("click", () => (ready ? init() : log("the kitchen page has not said ready yet")));

      frame.src = `${kitchen}/page/?host=${encodeURIComponent(location.origin)}`;
    </script>
  </body>
</html>
